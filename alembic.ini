# Alembic configuration file.
# The DATABASE_URL is read from env via api/config.py in env.py — this value
# is a fallback for alembic CLI only (override with --config or -x db=...).

[alembic]
script_location = db/migrations
# prepend_sys_path is needed so `from api.config import settings` works
prepend_sys_path = .

# The sqlalchemy.url here is overridden programmatically in db/migrations/env.py
# via settings.DATABASE_URL, so this line is only a CLI fallback.
sqlalchemy.url = postgresql+asyncpg://smartintake:smartintake_secret@localhost:5432/smartintake

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
